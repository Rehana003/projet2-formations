services:
  web:
    build: ./web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - app

  app:
    build: ./app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/projet
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: projet
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d projet"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
